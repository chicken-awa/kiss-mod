pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven{
			name = "KikuGie Snapshots"
			url = "https://maven.kikugie.dev/snapshots"
		}
		mavenCentral()
		gradlePluginPortal()
	}
}
plugins {
	id 'dev.kikugie.stonecutter' version '0.8-beta.3'
}
stonecutter {
	create(rootProject) {
		versions("1.21","1.21.1","1.21.2","1.21.3","1.21.4","1.21.5")
		vcsVersion = "1.21"
	}
}