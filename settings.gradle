pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven{
			name = "KikuGie Snapshots"
			url = "https://maven.kikugie.dev/snapshots"
		}
		mavenCentral()
		gradlePluginPortal()
	}
}
plugins {
	id 'dev.kikugie.stonecutter' version '0.8-beta.3'
}
stonecutter {
	create(rootProject) {
		versions("26.1")
		vcsVersion = "26.1"
	}
}