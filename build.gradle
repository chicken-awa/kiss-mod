plugins {
	id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
	id 'java'
	id 'dev.kikugie.stonecutter'
	id "com.modrinth.minotaur" version "2.9.0"
}
version = "${project.mod_version}-${minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}
repositories {
	mavenCentral()
	maven {
		url 'https://maven.fabricmc.net/'
	}
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url "https://maven.shedaniel.me/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation "maven.modrinth:modmenu:${project.modmenu_version}"
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	include api("maven.modrinth:proxlib:${project.proxlib_version}")
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_version": project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "kiss-mod"
	uploadFile = jar
	versionName = "Kiss Mod ${version}"
	changelog = ""
	dependencies {
		required.project "fabric-api"
		optional.project "modmenu"
		optional.project "cloth-config"
	}
	debugMode = true
}
tasks.named("modrinth") {
	outputs.upToDateWhen { false }
}