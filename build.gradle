plugins {
	id 'fabric-loom' version '1.14-SNAPSHOT'
	id 'java'

}
if (project.hasProperty('profileFile')) {
	def profileProperties = new Properties()
	file(profileFile).withInputStream { profileProperties.load(it) }
	profileProperties.each { key, value ->
		project.ext.set(key, value)
	}
	println "$profileFile"
	println "${project.minecraft_version}"
}
file('versions').listFiles().each { versionDir ->
	if (versionDir.isDirectory()) {
		def versionName = versionDir.name
		def propertiesFile = "versions/${versionName}/gradle.properties"

		if (file(propertiesFile).exists()) {
			tasks.register("build${versionName}", GradleBuild) {
				group = 'kiss clean,build'
				description = "构建 ${versionName} 版本"
				tasks = ['clean','build']
				startParameter.projectProperties = [profileFile: propertiesFile]
			}
			tasks.register("runClient${versionName}", GradleBuild) {
				group = 'kiss runClient'
				description = "运行 ${versionName} 版本"
				tasks = ['runClient']
				startParameter.projectProperties = [profileFile: propertiesFile]
			}
			tasks.register("switchTo${versionName}") {
				group = 'kiss switch'
				description = "切换到 ${versionName} 版本"
				doLast {
					def versionProps = new Properties()
					file(propertiesFile).withInputStream { versionProps.load(it) }

					def rootPropsFile = file("gradle.properties")
					def lines = rootPropsFile.readLines()

					def newContent = lines.collect { line ->
						if (line.startsWith("#") || line.isEmpty()) {
							return line
						}
						def matcher = line =~ /^([^=#]+)=(.*)$/
						if (matcher.matches()) {
							def key = matcher.group(1)

							if (versionProps.containsKey(key)) {
								return "${key}=${versionProps.get(key)}"
							}
						}
						return line
					}.join("\n")
					rootPropsFile.text = newContent
					println "已切换到版本 ${versionName}，请重新同步Gradle项目。"
				}
			}
		}
	}
}
version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		url 'https://maven.fabricmc.net/'
	}
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url "https://maven.shedaniel.me/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "maven.modrinth:modmenu:${project.modmenu_version}"
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_version": project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}