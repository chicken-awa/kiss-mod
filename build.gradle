plugins {
	id 'net.neoforged.moddev' version '2.0.141'
	id 'java'
	id 'dev.kikugie.stonecutter'
	id "com.modrinth.minotaur" version "2.9.0"
}
version = "${project.mod_version}-${minecraft_version}-${project.mod_loader}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}
repositories {
	mavenCentral()
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url "https://maven.shedaniel.me/"
	}
	flatDir {
		dirs rootProject.file("libs")
	}
}

neoForge {
	version = project.neoforge_version
	parchment {
		minecraftVersion = project.parchment_minecraft_version
		mappingsVersion = project.parchment_mappings_version
	}
	runs {
		client {
			client()
			def rnd = new Random()
			programArgument("--username")
			programArgument("Player" + rnd.nextInt(99999))
		}
		server {
			server()
		}
	}
	mods {
		register("kiss_mod") {
			sourceSet(sourceSets.main)
		}
	}
}

dependencies {
	implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
	//https://github.com/chicken-awa/ProxLib
	jarJar(implementation(":proxlib:${project.proxlib_version}"))
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version, "minecraft_version": project.minecraft_version, "java_version": project.java_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.java_version)
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "kiss-mod"
	uploadFile = jar
	versionName = "Kiss Mod ${version}"
	gameVersions = [project.minecraft_version]
	changelog = ""
	dependencies {
		optional.project "cloth-config"
	}
	debugMode = true
}
tasks.named("modrinth") {
	outputs.upToDateWhen { false }
}
def mcJavaLauncher = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
}
tasks.withType(JavaExec).configureEach {
	javaLauncher = mcJavaLauncher
}