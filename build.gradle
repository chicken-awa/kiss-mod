plugins {
	id 'fabric-loom' version '1.14-SNAPSHOT'
	id 'java'
	id 'dev.kikugie.stonecutter'
	id "com.modrinth.minotaur" version "2.9.0"
}
version = "${project.mod_version}-${minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}
repositories {
	mavenCentral()
	maven {
		url 'https://maven.fabricmc.net/'
	}
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url "https://maven.shedaniel.me/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "maven.modrinth:modmenu:${project.modmenu_version}"
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	include modApi("maven.modrinth:proxlib:${project.proxlib_version}")
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_version": project.minecraft_version, "java_version": project.java_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.java_version)
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "kiss-mod"
	uploadFile = remapJar
	versionName = "Kiss Mod ${version}"
	changelog = ""
	dependencies {
		required.project "fabric-api"
		optional.project "modmenu"
		optional.project "cloth-config"
	}
	debugMode = true
}
tasks.named("modrinth") {
	outputs.upToDateWhen { false }
}
def mcJavaLauncher = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
}
tasks.withType(JavaExec).configureEach {
	javaLauncher = mcJavaLauncher
}